<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration</title><link rel="stylesheet" href="style.css"></head><body><nav><a class="brand" href="index.html">TechNova Solutions</a><div class="navlinks"><a href="index.html">Home</a><a href="about.html">Company</a><a href="index.html#services">Services</a><a href="index.html#innovation">Innovation</a><a href="test.html">Online Test</a></div></nav><main class="container"><div class="formbox"><h1>Certificate Registration</h1><p>Complete your details after attending the test.</p><form id="reg" method="POST" action="https://formsubmit.co/technovasolutionsoft@gmail.com">
<input type="hidden" name="_subject" value="TechNova Solutions - New Certificate Registration">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_next" id="nextPage">
<input type="hidden" name="Test Score" id="mailScore">
<input type="hidden" name="Test Answers" id="mailAnswers"><label>Full Name<input id="name" name="Full Name" required></label><label>Email Address<input id="email" name="Participant Email" type="email" required></label><label>College / Institution<input id="college" name="College / Institution" required></label><label>Department<input id="dept" name="Department" required></label><button type="submit">Complete Registration</button></form><p id="status"></p></div></main><div class="footer">© 2026 TechNova Solutions · Innovation & Digital Technology Study Website</div><script>document.getElementById('reg').addEventListener('submit',function(){const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),college=document.getElementById('college').value.trim(),dept=document.getElementById('dept').value.trim(),score=localStorage.getItem('testScore')||'0',total=localStorage.getItem('testTotal')||'15';localStorage.setItem('regName',name);localStorage.setItem('regEmail',email);localStorage.setItem('regCollege',college);localStorage.setItem('regDept',dept);localStorage.setItem('regScore',score+'/'+total);document.getElementById('mailScore').value=score+'/'+total;document.getElementById('mailAnswers').value=localStorage.getItem('testAnswers')||'Not available';document.getElementById('nextPage').value=window.location.href.replace('register.html','certificate.html');});</script></body></html>
